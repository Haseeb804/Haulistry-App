name: haulistry
description: A booking platform for heavy machinery and transport services
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'  # Flutter 3.38.9 uses Dart 3.10.8

dependencies:
  flutter:
    sdk: flutter
  
  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.2
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.1
  
  # State Management
  provider: ^6.1.2
  get: ^4.7.2
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7
  
  # Navigation
  go_router: ^14.8.1
  
  # Forms & Validation
  flutter_form_builder: ^10.2.1
  form_builder_validators: ^11.2.1
  
  # Date & Time
  intl: ^0.20.2
  
  # Networking
  http: ^1.5.0
  dio: ^5.9.0
  graphql_flutter: ^5.2.0-beta.8
  
  # Firebase (Auth, Notifications & Real-time)
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.10
  firebase_database: ^11.3.10
  firebase_analytics: ^11.6.0
  firebase_storage: ^12.4.10
  cloud_firestore: ^5.6.12
  flutter_local_notifications: ^18.0.1
  
  # Local Storage
  shared_preferences: ^2.5.3
  
  # Image Picker
  image_picker: ^1.2.0
  permission_handler: ^12.0.1
  
  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  
  # Animations
  lottie: ^3.2.1
  flutter_animate: ^4.5.0
  
  # Icons
  font_awesome_flutter: ^10.8.0
  
  # Rating
  flutter_rating_bar: ^4.0.1
  
  # URL Launcher
  url_launcher: ^6.3.1
  
  # Payment Integration
  flutter_stripe: ^12.1.0
  razorpay_flutter: ^1.4.0
  
  # Real-time Communication
  socket_io_client: ^3.1.2
  
  # Voice & Calling (Cross-platform)
  agora_rtc_engine: ^6.5.3
  flutter_sound: ^9.16.3
  audio_waveforms: ^1.3.0
  
  # File Management
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  
  # Utilities
  package_info_plus: ^8.3.1
  fluttertoast: ^8.2.14
  freezed_annotation: ^3.1.0
  timezone: ^0.10.1
  connectivity_plus: ^6.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  freezed: ^3.2.5

flutter:
  uses-material-design: true
  
  # Uncomment and add specific assets as needed
  # assets:
  #   - assets/images/
  #   - assets/icons/
  #   - assets/animations/
  
  # Custom fonts can be added here when needed
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont.ttf