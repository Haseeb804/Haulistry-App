org.gradle.jvmargs=-Xms512m -Xmx4g -XX:MaxMetaspaceSize=512m -XX:+UseG1GC -XX:GCTimeLimit=50 -XX:GCHeapFreeRatio=10
android.useAndroidX=true
android.enableJetifier=true
android.injected.build.abi=armeabi-v7a,arm64-v8a
android.ndkVersion=27.3.13750724

# Build optimization
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=true

# Kotlin optimization
kotlin.incremental=true
kotlin.compiler.execution.strategy=in-process

# Android build optimization
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=true
android.enableR8.fullMode=false

# Prevent testOnly flag from being injected into release builds
android.injected.testOnly=false

# Network timeout settings (in milliseconds)
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
systemProp.http.socketTimeout=300000
systemProp.http.connectionTimeout=300000
